[project]
name = "datarova"
version = "1.0.0"
description = "DataRova projects + ASINs: Playwright sign-in -> DataRova API -> MySQL datarova_all_data"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49.0",
    "sqlalchemy>=2.0.30",
    "mysql-connector-python>=9.0.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is run from the project root, not installed, so put the root on
# sys.path -- otherwise `uv run pytest` cannot import `app`.
pythonpath = ["."]
addopts = "-q --strict-markers"
